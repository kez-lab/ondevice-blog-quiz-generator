<!DOCTYPE html>
<html lang="ko" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 On-Device Quiz AI Playground</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .gradient-text { background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="h-full flex flex-col text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="border-b border-slate-200 bg-white sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-cyan-500 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                    <i data-lucide="cpu" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold gradient-text">On-Device Quiz AI</h1>
                    <p class="text-xs text-slate-500 font-medium">Qwen2.5-0.5B Fine-Tuned Model Playground</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    MPS Metal 가속 활성화
                </span>
                <a href="https://huggingface.co/kez-lab/qwen2.5-0.5b-blog-quiz-android" target="_blank" class="text-xs font-medium text-slate-600 hover:text-indigo-600 flex items-center gap-1 border border-slate-200 rounded-lg px-3 py-1.5 hover:bg-slate-50 transition">
                    <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                    Hugging Face
                </a>
                <a href="https://github.com/kez-lab/ondevice-blog-quiz-generator" target="_blank" class="text-xs font-medium text-slate-600 hover:text-indigo-600 flex items-center gap-1 border border-slate-200 rounded-lg px-3 py-1.5 hover:bg-slate-50 transition">
                    <i data-lucide="github" class="w-3.5 h-3.5"></i>
                    GitHub
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- Left Column: Input Form (5 cols) -->
            <div class="lg:col-span-5 space-y-6">
                <div class="glass-card border border-slate-200/80 rounded-2xl p-6 shadow-sm">
                    <div class="flex items-center justify-between mb-4">
                        <label class="text-sm font-bold text-slate-900 flex items-center gap-2">
                            <i data-lucide="file-text" class="w-4 h-4 text-indigo-600"></i>
                            블로그 본문 텍스트
                        </label>
                        <span id="charCount" class="text-xs text-slate-600 font-semibold bg-slate-100 px-2 py-0.5 rounded-full">0자</span>
                    </div>

                    <!-- Preset Chips -->
                    <div class="mb-3">
                        <p class="text-xs font-semibold text-slate-700 mb-2">📌 샘플 프리셋 불러오기:</p>
                        <div class="flex flex-wrap gap-1.5">
                            <button onclick="setPreset('compose')" class="text-xs px-2.5 py-1 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium transition border border-indigo-200/60">
                                🎨 Compose LiveEvent
                            </button>
                            <button onclick="setPreset('coroutine')" class="text-xs px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium transition border border-slate-200">
                                ⚡ Kotlin Coroutine
                            </button>
                            <button onclick="setPreset('quantization')" class="text-xs px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium transition border border-slate-200">
                                🤖 INT4 양자화
                            </button>
                        </div>
                    </div>

                    <textarea id="articleInput" rows="10" 
                        class="w-full text-sm text-slate-900 bg-slate-50 border border-slate-300 rounded-xl p-3.5 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition resize-none placeholder-slate-400 leading-relaxed font-mono"
                        placeholder="여기에 블로그 글이나 기술 문서를 붙여넣으세요..."></textarea>

                    <!-- Control Settings -->
                    <div class="mt-4 pt-4 border-t border-slate-100 grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1.5">🎯 퀴즈 문항 수</label>
                            <select id="countSelect" class="w-full text-xs font-medium text-slate-800 bg-slate-50 border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                                <option value="1">1문제</option>
                                <option value="2">2문제</option>
                                <option value="3" selected>3문제 (추천)</option>
                                <option value="4">4문제</option>
                                <option value="5">5문제</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1.5">🌡️ 온도 (창의성)</label>
                            <select id="tempSelect" class="w-full text-xs font-medium text-slate-800 bg-slate-50 border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                                <option value="0.1" selected>0.1 (정확 & 논리적)</option>
                                <option value="0.3">0.3 (표준)</option>
                                <option value="0.7">0.7 (창의적)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button id="generateBtn" onclick="generateQuiz()" 
                        class="w-full mt-5 bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-700 hover:to-indigo-800 text-white font-semibold text-sm py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-200 active:scale-[0.99] transition flex items-center justify-center gap-2">
                        <i data-lucide="sparkles" class="w-4 h-4"></i>
                        <span id="btnText">온디바이스 퀴즈 생성하기</span>
                    </button>
                </div>
            </div>

            <!-- Right Column: Quiz Output (7 cols) -->
            <div class="lg:col-span-7 space-y-6">
                
                <!-- Initial Empty State -->
                <div id="emptyState" class="glass-card border border-dashed border-slate-300 rounded-2xl p-12 text-center">
                    <div class="w-16 h-16 rounded-2xl bg-indigo-50 text-indigo-600 mx-auto flex items-center justify-center mb-4">
                        <i data-lucide="brain-circuit" class="w-8 h-8"></i>
                    </div>
                    <h3 class="text-base font-bold text-slate-800 mb-1">생성된 퀴즈가 여기에 표시됩니다</h3>
                    <p class="text-xs text-slate-500 max-w-sm mx-auto leading-relaxed">
                        왼쪽에 블로그 글을 붙여넣고 <strong class="text-indigo-600 font-semibold">[퀴즈 생성하기]</strong> 버튼을 누르면 AI가 핵심 내용을 분석하여 4지선다 문제를 만듭니다.
                    </p>
                </div>

                <!-- Loading Spinner State -->
                <div id="loadingState" class="hidden glass-card border border-indigo-100 rounded-2xl p-12 text-center bg-indigo-50/30">
                    <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-200 border-t-indigo-600 mb-4"></div>
                    <h3 class="text-sm font-bold text-indigo-900 mb-1">Apple Silicon Metal GPU에서 퀴즈 추론 중...</h3>
                    <p class="text-xs text-indigo-600/80">문맥을 분석하고 헷갈리는 오답 보기를 설계하고 있습니다.</p>
                </div>

                <!-- Quiz Cards Container -->
                <div id="quizContainer" class="hidden space-y-5"></div>

                <!-- Raw JSON View Accordion -->
                <div id="rawJsonSection" class="hidden glass-card border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
                    <button onclick="toggleRawJson()" class="w-full px-5 py-3.5 bg-slate-50/80 hover:bg-slate-100/80 flex items-center justify-between text-xs font-semibold text-slate-700 transition">
                        <span class="flex items-center gap-2">
                            <i data-lucide="code-2" class="w-4 h-4 text-slate-500"></i>
                            AI 원본 JSON 응답 보기
                        </span>
                        <i id="jsonChevron" data-lucide="chevron-down" class="w-4 h-4 text-slate-400 transition-transform"></i>
                    </button>
                    <div id="rawJsonContent" class="hidden p-4 bg-slate-900 text-slate-100 font-mono text-xs overflow-x-auto max-h-72">
                        <pre id="rawJsonText"></pre>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <!-- Interactive Script -->
    <script>
        lucide.createIcons();

        const PRESETS = {
            compose: `[Android/Compose] Compose에서 SingleLiveEvent를 사용하며 겪은 두 가지 문제

1. 완료된 LaunchedEffect의 scope를 다시 참조하는 문제:
API 호출이 성공하면 특정 위치로 스크롤해야 할 때 LaunchedEffect 안에서 LiveData.observe()를 호출하면, observe()는 등록 즉시 반환되므로 LaunchedEffect 블록이 종료되어 Job이 완료됩니다. 나중에 API 응답이 도착해 observer 내부에서 launch로 suspend 함수(animateScrollToItem)를 실행하려 하면 이미 완료된 부모 Job 때문에 코루틴이 시작하지 못하고 취소됩니다.

2. 조건부 Composition에서 Observer가 중복 등록되는 문제:
if (visible) { LaunchedEffect(Unit) { event.observe(lifecycleOwner) { ... } } } 형태의 코드에서, visible이 false가 되었다가 다시 true가 되어 재진입할 때마다 LaunchedEffect(Unit)이 새로 생성되면서 같은 LifecycleOwner에 observer가 계속 누적 등록됩니다. SingleLiveEvent는 AtomicBoolean 플래그 때문에 한 번만 실행되는 것처럼 보이지만 내부에 미사용 observer 래퍼가 계속 쌓이게 됩니다.

3. 해결 방법:
LiveData를 유지해야 한다면 DisposableEffect의 onDispose에서 removeObserver를 호출하여 등록과 해제를 한 쌍으로 관리해야 합니다. 또는 UI State(scrollTarget)로 단일 이벤트를 처리하거나, ViewModel에서 Channel을 receiveAsFlow()로 변환하여 LaunchedEffect에서 collect하는 구조가 권장됩니다.`,
            coroutine: `Kotlin 코루틴은 OS 네이티브 스레드를 매번 생성하는 대신, 기존 스레드를 차단(blocking)하지 않고 실행을 중단(suspend)했다가 재개(resume)하는 경량 스레드입니다. 
Dispatchers.IO는 네트워크 통신 및 디스크 I/O 작업에 특화되어 있으며 스레드 풀 크기가 동적으로 조절됩니다. 
Dispatchers.Default는 대규모 데이터 정렬 등 CPU 집약적 연산에 최적화되어 있습니다. 
StateFlow는 항상 최신 상태를 유지하며 UI 레이어에서 상태 홀더로 사용되는 Hot Stream입니다.`,
            quantization: `온디바이스 AI는 클라우드 서버 없이 기기 내부의 NPU/GPU에서 모델을 직접 구동하여 100% 개인정보 보호와 오프라인 실행을 보장합니다. 
32비트 부동소수점(FP32) 가중치를 4비트(INT4) 정수로 압축하는 양자화(Quantization)를 적용하여 모델 용량을 수백 메가바이트로 축소할 수 있습니다. 
LoRA(Low-Rank Adaptation)는 원본 모델을 고정하고 저순위 어댑터 행렬만 학습시켜 파인튜닝 효율을 극대화합니다.`
        };

        const articleInput = document.getElementById('articleInput');
        const charCount = document.getElementById('charCount');

        articleInput.addEventListener('input', () => {
            charCount.textContent = `${articleInput.value.length}자`;
        });

        function setPreset(key) {
            articleInput.value = PRESETS[key] || '';
            charCount.textContent = `${articleInput.value.length}자`;
        }

        // 초기 프리셋 설정
        setPreset('compose');

        async function generateQuiz() {
            const article = articleInput.value.trim();
            if (!article || article.length < 20) {
                alert('최소 20자 이상의 블로그 글을 입력해주세요.');
                return;
            }

            const count = parseInt(document.getElementById('countSelect').value, 10);
            const temperature = parseFloat(document.getElementById('tempSelect').value);

            // UI 상태 변경
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('quizContainer').classList.add('hidden');
            document.getElementById('rawJsonSection').classList.add('hidden');
            document.getElementById('loadingState').classList.remove('hidden');
            
            const generateBtn = document.getElementById('generateBtn');
            generateBtn.disabled = true;
            generateBtn.classList.add('opacity-75', 'cursor-not-allowed');
            document.getElementById('btnText').textContent = 'AI 퀴즈 생성 중...';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ article, count, temperature })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || '생성 실패');
                }

                const data = await response.json();
                renderQuizzes(data.quizzes, data.raw_json);
            } catch (err) {
                alert('에러: ' + err.message);
                document.getElementById('emptyState').classList.remove('hidden');
            } finally {
                document.getElementById('loadingState').classList.add('hidden');
                generateBtn.disabled = false;
                generateBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                document.getElementById('btnText').textContent = '온디바이스 퀴즈 생성하기';
            }
        }

        function renderQuizzes(quizzes, rawJson) {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            if (!quizzes || quizzes.length === 0) {
                container.innerHTML = `
                    <div class="p-6 bg-amber-50 border border-amber-200 rounded-2xl text-amber-900 text-sm">
                        ⚠️ 퀴즈를 생성하지 못했습니다. AI 출력을 확인하세요.
                    </div>
                `;
            } else {
                quizzes.forEach((q, qIndex) => {
                    const card = document.createElement('div');
                    card.className = "glass-card border border-slate-200/90 rounded-2xl p-6 shadow-sm hover:shadow-md transition";
                    
                    const optionsHtml = q.options.map((opt, optIndex) => `
                        <button onclick="checkAnswer(${qIndex}, ${optIndex}, ${q.answer_index})" 
                            id="btn-${qIndex}-${optIndex}"
                            class="option-btn text-left p-3.5 rounded-xl border border-slate-200 bg-slate-50/70 hover:bg-indigo-50/50 hover:border-indigo-200 text-xs text-slate-700 font-medium transition flex items-start gap-2.5">
                            <span class="w-5 h-5 rounded-full bg-white border border-slate-300 text-slate-500 flex items-center justify-center text-[10px] font-bold shrink-0 mt-0.5">
                                ${String.fromCharCode(65 + optIndex)}
                            </span>
                            <span class="flex-1 leading-relaxed">${escapeHtml(opt)}</span>
                        </button>
                    `).join('');

                    card.innerHTML = `
                        <div class="flex items-start gap-3 mb-4">
                            <span class="px-2.5 py-1 rounded-lg bg-indigo-600 text-white font-bold text-xs shadow-sm shadow-indigo-200 shrink-0">
                                Q${qIndex + 1}
                            </span>
                            <h4 class="text-sm font-bold text-slate-900 leading-snug pt-0.5">
                                ${escapeHtml(q.question)}
                            </h4>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mb-4">
                            ${optionsHtml}
                        </div>
                        <!-- Answer Feedback & Explanation Box -->
                        <div id="feedback-${qIndex}" class="hidden mt-3 p-4 rounded-xl border text-xs leading-relaxed transition-all">
                            <div id="badge-${qIndex}" class="font-bold mb-1.5 flex items-center gap-1.5"></div>
                            <p id="expText-${qIndex}" class="text-slate-600"></p>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            container.classList.remove('hidden');

            // Set raw json
            document.getElementById('rawJsonText').textContent = rawJson || JSON.stringify(quizzes, null, 2);
            document.getElementById('rawJsonSection').classList.remove('hidden');

            lucide.createIcons();
        }

        function checkAnswer(qIndex, selectedIndex, correctIndex) {
            const isCorrect = (selectedIndex === correctIndex);
            
            // Highlight buttons
            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`btn-${qIndex}-${i}`);
                if (!btn) continue;
                btn.disabled = true;
                btn.classList.remove('hover:bg-indigo-50/50', 'hover:border-indigo-200');
                
                if (i === correctIndex) {
                    btn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-900', 'font-bold');
                } else if (i === selectedIndex && !isCorrect) {
                    btn.classList.add('bg-rose-50', 'border-rose-400', 'text-rose-900');
                } else {
                    btn.classList.add('opacity-60');
                }
            }

            // Show explanation
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const badge = document.getElementById(`badge-${qIndex}`);
            const expText = document.getElementById(`expText-${qIndex}`);

            if (isCorrect) {
                feedback.className = "mt-3 p-4 rounded-xl border bg-emerald-50/80 border-emerald-200 text-xs";
                badge.className = "font-bold text-emerald-800 mb-1.5 flex items-center gap-1";
                badge.innerHTML = `<i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-600"></i> 🎉 정답입니다! (${String.fromCharCode(65 + correctIndex)}번)`;
            } else {
                feedback.className = "mt-3 p-4 rounded-xl border bg-rose-50/80 border-rose-200 text-xs";
                badge.className = "font-bold text-rose-800 mb-1.5 flex items-center gap-1";
                badge.innerHTML = `<i data-lucide="x-circle" class="w-4 h-4 text-rose-600"></i> ❌ 오답입니다. 정답은 ${String.fromCharCode(65 + correctIndex)}번입니다.`;
            }

            // Get quiz explanation
            const rawQuizzes = JSON.parse(document.getElementById('rawJsonText').textContent || '[]');
            const currentExp = (rawQuizzes[qIndex] && rawQuizzes[qIndex].explanation) ? rawQuizzes[qIndex].explanation : '';
            expText.textContent = `💡 해설: ${currentExp}`;

            feedback.classList.remove('hidden');
            lucide.createIcons();
        }

        function toggleRawJson() {
            const content = document.getElementById('rawJsonContent');
            const chevron = document.getElementById('jsonChevron');
            content.classList.toggle('hidden');
            chevron.classList.toggle('rotate-180');
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
